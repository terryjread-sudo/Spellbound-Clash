<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spellbound Clash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-wrapper">
        <h1>Spellbound Clash</h1>

        <!-- Heads Up Display -->
        <div id="hud">
            <div>Blue Base: <span id="playerHp" class="blue-stat">100</span> HP</div>
            <div>Gold: <span id="gold" class="gold-stat">80</span></div>
            <div>Red Base: <span id="enemyHp" class="red-stat">100</span> HP</div>
        </div>

        <!-- Game Canvas & Modals -->
        <div id="canvas-container">
            <canvas id="gameCanvas" width="900" height="450"></canvas>

            <!-- Spellbook Quiz Modal -->
            <div id="spellbook-modal" class="modal hidden">
                <div class="modal-content">
                    <h2>📖 Spellbook Challenge</h2>
                    <p id="spell-question">Loading question...</p>
                    <div id="spell-options"></div>
                </div>
            </div>

            <!-- Wizard Upgrade Modal -->
            <div id="upgrade-modal" class="modal hidden">
                <div class="modal-content">
                    <h2>🧙 Wizard Upgrade</h2>
                    <p>Current Level: <span id="wiz-level">1</span></p>
                    <button id="btn-upgrade" class="btn btn-gold">Upgrade</button>
                    <button id="btn-close-upgrade" class="btn btn-dark" style="margin-top: 10px;">Close</button>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div id="controls">
            <button id="btn-knight" class="btn">🛡️ Spawn Knight (30g)</button>
            <button id="btn-wizard" class="btn">🧙 Build Wizard (50g)</button>
            <button id="btn-spellbook" class="btn btn-gold">📖 Read Spellbook (+50g)</button>
            <button id="btn-editor" class="btn btn-dark">🛠️ Toggle Edit Mode</button>
        </div>

        <div id="info-text">
            Place wizards on designated slots to defend your base against incoming enemy knights!
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
