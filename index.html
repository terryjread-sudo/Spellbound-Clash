<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spellbound Clash 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer">

        <!-- Top HUD -->
        <div id="hud">
            <div class="hud-team blue-team">
                <span>🏰 Blue Castle</span>
                <div class="hp-bar-bg">
                    <div id="playerHpFill" class="hp-bar-fill blue-fill" style="width: 100%;"></div>
                </div>
                <span id="playerHp">100</span>
            </div>

            <div class="hud-gold">
                <span>🪙</span>
                <span id="gold">80</span>
            </div>

            <div class="hud-team red-team">
                <span id="enemyHp">100</span>
                <div class="hp-bar-bg">
                    <div id="enemyHpFill" class="hp-bar-fill red-fill" style="width: 100%;"></div>
                </div>
                <span>🏰 Red Castle</span>
            </div>
        </div>

        <div id="info-banner">⚔️ Auto-spawning weak knights! Specialize Wizards into 🔥 Fire / ❄️ Ice, then unlock ⚡ Swift Boots & ✨ Castle Teleport!</div>

        <!-- Bottom Controls -->
        <div id="controls">
            <button id="btn-knight" class="btn">🛡️ Spawn Mega Knight (40g)</button>
            <button id="btn-wizard" class="btn">🧙 Build Wizard (50g)</button>
            <button id="btn-spellbook" class="btn btn-gold">📖 Read Spellbook (+50g)</button>
            <button id="btn-editor" class="btn btn-dark">🛠️ Toggle Edit Mode</button>
        </div>

    </div>

    <!-- Spellbook Quiz Modal -->
    <div id="spellbook-modal" class="modal hidden">
        <div class="modal-content">
            <h2>📖 Spellbook Challenge</h2>
            <p id="spell-question">Loading question...</p>
            <div id="spell-options"></div>
        </div>
    </div>

    <!-- Wizard Upgrade Modal -->
    <div id="upgrade-modal" class="modal hidden">
        <div class="modal-content">
            <h2>🧙 Wizard Upgrade & Mastery</h2>
            <p>Current Rank: <strong id="wiz-level" style="color: #38bdf8;">L1 (Standard)</strong></p>
            
            <div id="upgrade-branch" style="display: flex; flex-direction: column; gap: 10px; margin: 15px 0;">
                <!-- Level 1 -> 2 Choice -->
                <button id="btn-upgrade-fire" class="btn" style="background: linear-gradient(135deg, #ea580c, #c2410c);">🔥 Fire Wizard (40g) - High Blast Damage</button>
                <button id="btn-upgrade-ice" class="btn" style="background: linear-gradient(135deg, #0284c7, #0369a1);">❄️ Ice Wizard (40g) - Freezing Slow Effect</button>
                
                <!-- Level 2 -> 3 Mobility Upgrade -->
                <button id="btn-upgrade-swift" class="btn btn-gold" style="display: none;">⚡ Swift Boots (50g) - Fast Castle Healing Retreat</button>
                
                <!-- Level 3 -> 4 Teleport Upgrade -->
                <button id="btn-upgrade-teleport" class="btn btn-gold" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9); display: none;">✨ Castle Teleport (80g) - Instant Castle Healing</button>
                
                <div id="wiz-max-msg" style="display: none; color: #a855f7; font-weight: 800; font-size: 16px;">✨ MAX POWER UNLOCKED!</div>
            </div>
            <button id="btn-close-upgrade" class="btn btn-dark" style="margin-top: 5px;">Close</button>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- 3D Game Engine -->
    <script src="game.js"></script>
</body>
</html>
