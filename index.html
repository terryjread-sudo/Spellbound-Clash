<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spellbound Clash 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            color: white;
            border: 2px solid #FFD700;
        }

        h1 { margin-top: 0; font-size: 24px; color: #FFD700; }
        .gold-text { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        
        button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: 0.2s;
        }
        
        #read-btn { background-color: #4CAF50; color: white; }
        #read-btn:hover { background-color: #45a049; }
        
        #wizard-btn { background-color: #2196F3; color: white; }
        #wizard-btn:hover { background-color: #0b7dda; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>Spellbound Clash 3D</h1>
        <div class="gold-text" id="gold-display">Gold: 0</div>
        <button id="read-btn" onclick="readBook()">📖 Read a Book (+10 Gold)</button>
        <button id="wizard-btn" onclick="placeWizard()">🧙 Place Wizard (Cost: 20)</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. GAME VARIABLES ---
        let gold = 0;
        const enemies = [];
        const wizards = [];

        // --- 2. SET UP THE 3D SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 

        // CAMERA FIX: Moved much higher on the Y-axis and further back on the Z-axis
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 30); 
        camera.lookAt(0, 0, 0); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Add the Ground 
        const planeGeo = new THREE.PlaneGeometry(60, 40);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27 }); 
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2; 
        scene.add(plane);

        // Add a Dirt Path
        const pathGeo = new THREE.PlaneGeometry(60, 4);
        const pathMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
        const path = new THREE.Mesh(pathGeo, pathMat);
        path.rotation.x = -Math.PI / 2;
        path.position.y = 0.05; 
        scene.add(path);

        // --- 3. BUILD A KNIGHT FUNCTION ---
        function createKnightMesh() {
            const knight = new THREE.Group();

            // Materials for our knight
            const armorMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.3 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
            const plumeMat = new THREE.MeshStandardMaterial({ color: 0xcc0000 }); // Red feather

            // Body (Cylinder)
            const bodyGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.5, 16);
            const body = new THREE.Mesh(bodyGeo, armorMat);
            body.position.y = 0.75;
            knight.add(body);

            // Head (Sphere)
            const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 1.7;
            knight.add(head);

            // Helmet (Cone)
            const helmGeo = new THREE.ConeGeometry(0.5, 0.6, 16);
            const helm = new THREE.Mesh(helmGeo, armorMat);
            helm.position.y = 2.1;
            knight.add(helm);

            // Plume (Small Cone on top)
            const plumeGeo = new THREE.ConeGeometry(0.1, 0.4, 8);
            const plume = new THREE.Mesh(plumeGeo, plumeMat);
            plume.position.y = 2.5;
            knight.add(plume);

            // Sword (Long Box)
            const swordGeo = new THREE.BoxGeometry(0.1, 1.5, 0.3);
            const sword = new THREE.Mesh(swordGeo, armorMat);
            sword.position.set(0.7, 1.0, 0); // Put it in his "hand"
            sword.rotation.x = Math.PI / 4; // Angle it forward
            knight.add(sword);

            // Scale the whole grouped knight down a bit
            knight.scale.set(0.8, 0.8, 0.8);

            return knight;
        }

        // --- 4. GAME FUNCTIONS ---
        function readBook() {
            gold += 10;
            document.getElementById('gold-display').innerText = `Gold: ${gold}`;
        }

        function placeWizard() {
            if (gold >= 20) {
                gold -= 20;
                document.getElementById('gold-display').innerText = `Gold: ${gold}`;
                
                // Blue Cone Wizard
                const wizardGeo = new THREE.ConeGeometry(1, 3, 16);
                const wizardMat = new THREE.MeshStandardMaterial({ color: 0x0044ff });
                const wizard = new THREE.Mesh(wizardGeo, wizardMat);
                
                const randomX = (Math.random() - 0.5) * 40;
                const randomZ = (Math.random() * -10) - 5; 
                
                wizard.position.set(randomX, 1.5, randomZ);
                scene.add(wizard);
                wizards.push(wizard);
            } else {
                alert("Not enough gold! Go read a book!");
            }
        }

        function spawnEnemy() {
            const knight = createKnightMesh();
            knight.position.set(-30, 0.05, 0); // Start at the left edge of path
            scene.add(knight);
            enemies.push(knight);
        }

        setInterval(spawnEnemy, 2000);

        // --- 5. THE ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                enemy.position.x += 0.05; // Slide right

                // Removed the rotation code so they don't roll like cubes anymore!

                if (enemy.position.x > 30) {
                    scene.remove(enemy);
                    enemies.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
